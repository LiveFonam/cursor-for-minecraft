[project]
name = "fighter"
version = "0.1.0"
description = "A 1 versus 1 Minecraft combat simulator and masked PPO trainer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
    "gymnasium>=1.0",
    "numpy>=1.26",
    "sb3-contrib>=2.4",
    "stable-baselines3>=2.4",
    "torch>=2.4",
]

[project.scripts]
fighter = "fighter.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fighter"]

[tool.pytest.ini_options]
testpaths = ["tests"]
