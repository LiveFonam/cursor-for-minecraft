<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FNNs</title>
<style>
:root {
  --bg: #1e1e1e; --edge: #333333; --text: #ececec; --dim: #a2a2a2; --green: #22e07a; --red: #ff6b6b; --tip: #2a2a2a;
}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; background: var(--bg); color: var(--text);
  font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; overflow: hidden; }
body { display: flex; flex-direction: column; }
header { flex: none; display: flex; align-items: center; gap: 14px; padding: 6px 18px 2px; }
h1 { margin: 0; font-size: clamp(17px, 1.25vw, 30px); line-height: 1.1; }
#status { font-size: clamp(11px, .72vw, 18px); color: var(--dim); white-space: nowrap; }
#status.live { color: var(--green); font-weight: 700; }
#meter { margin-left: auto; display: flex; align-items: center; gap: 9px; font-size: clamp(11px, .72vw, 18px);
  color: var(--dim); white-space: nowrap; }
#bar { position: relative; width: clamp(110px, 10vw, 260px); height: 6px; border-radius: 3px; background: #444; }
#fill { position: absolute; top: -3px; width: 3px; height: 12px; margin-left: -1px; left: 50%; background: #fff;
  transition: left .12s linear; }
#valueText { min-width: 3.2em; text-align: right; font-variant-numeric: tabular-nums; color: var(--text); }
main { flex: 1; min-height: 0; position: relative; }
canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
#post { flex: none; display: flex; align-items: stretch; gap: clamp(14px, 1.6vw, 40px); padding: 7px 18px 5px;
  border-top: 1px solid var(--edge); font-size: clamp(12px, .78vw, 20px); font-variant-numeric: tabular-nums; }
.zone { flex: none; min-width: 0; }
.zone.grow { flex: 1; }
.lab { color: var(--dim); font-size: .92em; white-space: nowrap; margin-bottom: 3px; }
#score { font-size: 1.45em; font-weight: 700; white-space: nowrap; line-height: 1.15; }
#matchNote { color: var(--dim); font-size: .92em; white-space: nowrap; margin-top: 2px; }
#tiles { display: flex; gap: clamp(12px, 1.5vw, 36px); }
.tile { white-space: nowrap; line-height: 1.28; }
.tile .h { color: var(--dim); font-size: .92em; }
.tile b { font-weight: 700; }
.tile .who { color: var(--dim); display: inline-block; min-width: 3.6em; }
.won { color: var(--green); } .lost { color: var(--red); }
#record { font-weight: 700; white-space: nowrap; line-height: 1.2; }
#recNote { color: var(--dim); font-size: .92em; white-space: nowrap; }
.dots { display: flex; gap: 4px; margin-top: 4px; height: 10px; }
.dots i { width: 10px; height: 10px; border-radius: 50%; background: #666; }
.dots i.win { background: var(--green); } .dots i.loss { background: var(--red); }
footer { flex: none; padding: 1px 18px 5px; font-size: clamp(11px, .68vw, 17px); color: var(--dim);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#tip { position: fixed; z-index: 5; max-width: 430px; min-width: 240px; padding: 9px 12px; background: var(--tip);
  border: 1px solid #5a5a5a; border-radius: 6px; box-shadow: 0 6px 22px #000b;
  font-size: clamp(12.5px, .78vw, 19px); line-height: 1.3; display: none; }
#tip h3 { margin: 0 0 3px; font-size: 1.1em; }
#tip .dim { color: var(--dim); font-size: .92em; }
#tip table { border-collapse: collapse; width: 100%; margin-top: 3px; }
#tip td { padding: 1px 0; vertical-align: top; }
#tip td.n { text-align: right; padding-left: 14px; font-weight: 700; white-space: nowrap; font-variant-numeric: tabular-nums; }
#tip tr.pk td { color: var(--green); font-weight: 700; }
#tip tr.off td { color: #777; }
.map { display: grid; gap: 2px; width: 150px; margin: 5px 0; }
.map i { aspect-ratio: 1; background: #3a3a3a; }
.map i.wall { background: #d8d8d8; } .map i.hole { background: var(--red); } .map i.me { outline: 2px solid var(--green); outline-offset: -2px; }
</style>
</head>
<body>
<header>
  <h1>FNNs</h1>
  <div id="status">connecting</div>
  <div id="meter"><span>How well the fight is going</span><span>losing</span><div id="bar"><div id="fill"></div></div><span>winning</span><span id="valueText"></span></div>
</header>
<main><canvas id="net"></canvas></main>
<section id="post">
  <div class="zone">
    <div class="lab">Best of 3</div>
    <div id="score">FNNs 0, Player 0</div>
    <div id="matchNote"></div>
  </div>
  <div class="zone grow">
    <div class="lab" id="lastLab">Last round</div>
    <div id="tiles"></div>
  </div>
  <div class="zone">
    <div class="lab">All show match rounds</div>
    <div id="record"></div>
    <div id="recNote"></div>
    <div class="dots" id="recent"></div>
  </div>
</section>
<footer id="note"></footer>
<div id="tip"></div>
<script>
'use strict'
const GREEN = '34,224,122'
const FONT = '-apple-system, "Segoe UI", Roboto, Arial, sans-serif'
const BUCKETS = 10
const canvas = document.getElementById('net'), ctx = canvas.getContext('2d')
const tip = document.getElementById('tip'), statusEl = document.getElementById('status')
tip.style.setProperty('pointer-' + 'ev' + 'ents', 'none')  // the tooltip never catches the mouse
let META = null, F = null, L = null, hover = null, mouse = null, lastFrame = 0, connected = false

const bytes = s => { const b = atob(s), a = new Uint8Array(b.length); for (let i = 0; i < b.length; i++) a[i] = b.charCodeAt(i); return a }
const f32 = s => new Float32Array(bytes(s).buffer)
const i8 = s => new Int8Array(bytes(s).buffer)
const i16 = s => new Int16Array(bytes(s).buffer)
const clamp = (x, a, b) => Math.min(b, Math.max(a, x))
const esc = s => String(s).replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]))

function decode (m) {
  return { n: m.n, v: m.v, pick: m.pick, raw: f32(m.raw), g: bytes(m.g), h1: i8(m.h1), h2: i8(m.h2), p: f32(m.p),
    m: bytes(m.m), e: m.e.map(i8), ti: bytes(m.ti), tc: i16(m.tc) }
}

// Four evenly spaced columns, with the words outside the first and last so no line ever runs under them
function layout () {
  const W = canvas.clientWidth, H = canvas.clientHeight, dpr = window.devicePixelRatio || 1
  canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr)
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
  const u = clamp(Math.min(W / 1920, H / 860), 0.6, 2.4)
  const size = Math.max(12.5, 16 * u), small = Math.max(11.5, 14 * u), pad = 18, headH = Math.max(24, 30 * u)

  ctx.font = `600 ${size}px ${FONT}`
  const labelW = Math.max(...META.nodes.map(n => ctx.measureText(n[0]).width))
  const nameW = Math.max(...META.actions.map(a => ctx.measureText(a.name).width))
  ctx.font = `700 ${size}px ${FONT}`
  const pickW = Math.max(...META.actions.flatMap(a => a.options.map(o => ctx.measureText(o).width)))
  ctx.font = `500 ${small}px ${FONT}`
  const pctW = ctx.measureText('100%').width
  const gap = 10 * Math.max(u, 0.8), rightW = nameW + pickW + pctW + gap * 2

  const top = headH + 4, bottom = H - 6, span = bottom - top
  // the neuron columns hold more circles, so they get their own smaller size
  const r = clamp(span / Math.max(META.nodes.length, META.actions.length) * 0.36, 6, 17 * u)
  const neuronR = clamp(span / META.shown * 0.38, 4, 17 * u)
  const x0 = pad + labelW + gap + r, x3 = W - pad - rightW - gap - r, step = (x3 - x0) / 3
  const xs = [x0, x0 + step, x0 + step * 2, x3]
  const column = (n, x, make, rad = r) => Array.from({ length: n }, (_, i) => ({ cx: x, cy: top + span * (i + 0.5) / n, r: rad, ...make(i) }))

  let base = 0
  const bases = META.actions.map(a => { const b = base; base += a.options.length; return b })
  return {
    W, H, u, size, small, r, xs, headH, gap, labelW, nameW, pickW, pctW, rightW, bases,
    columns: [
      column(META.nodes.length, xs[0], i => ({ kind: 'input', i })),
      column(META.shown, xs[1], i => ({ kind: 'n1', i }), neuronR),
      column(META.shown, xs[2], i => ({ kind: 'n2', i }), neuronR),
      column(META.actions.length, xs[3], i => ({ kind: 'decision', i }))
    ]
  }
}

function drawLines () {
  if (!F) return
  const buckets = Array.from({ length: BUCKETS }, () => [])
  const lit = []
  F.e.forEach((m, gap) => {
    const from = L.columns[gap], to = L.columns[gap + 1]
    for (let t = 0; t < to.length; t++) {
      for (let s = 0; s < from.length; s++) {
        const v = Math.abs(m[t * from.length + s]) / 127
        if (v < 0.025) continue
        const a = from[s], b = to[t]
        buckets[Math.min(BUCKETS - 1, Math.floor(Math.pow(v, 1.15) * BUCKETS))].push(a, b)
        if (hover && (hover === a || hover === b)) lit.push(a, b, v)
      }
    }
  })
  ctx.lineCap = 'butt'
  const fade = hover ? 0.28 : 1
  buckets.forEach((list, k) => {
    if (!list.length) return
    const b = (k + 0.5) / BUCKETS
    ctx.strokeStyle = `rgba(${GREEN},${((0.05 + 0.93 * b * b) * fade).toFixed(3)})`
    ctx.lineWidth = (0.55 + 2.5 * b * b) * Math.max(L.u, 0.75)
    ctx.beginPath()
    for (let i = 0; i < list.length; i += 2) { ctx.moveTo(list[i].cx, list[i].cy); ctx.lineTo(list[i + 1].cx, list[i + 1].cy) }
    ctx.stroke()
  })
  for (let i = 0; i < lit.length; i += 3) {
    const v = lit[i + 2]
    ctx.strokeStyle = `rgba(${GREEN},${(0.3 + 0.7 * v).toFixed(3)})`
    ctx.lineWidth = (0.8 + 2.4 * v) * Math.max(L.u, 0.75)
    ctx.beginPath(); ctx.moveTo(lit[i].cx, lit[i].cy); ctx.lineTo(lit[i + 1].cx, lit[i + 1].cy); ctx.stroke()
  }
}

function level (n) {
  if (!F) return 0
  if (n.kind === 'input') return F.g[n.i] / 255
  if (n.kind === 'n1') return Math.abs(F.h1[n.i]) / 127
  if (n.kind === 'n2') return Math.abs(F.h2[n.i]) / 127
  return F.p[L.bases[n.i] + F.pick[n.i]]
}

function drawCircles () {
  for (const col of L.columns) {
    for (const n of col) {
      // tanh neurons sit near 1 most of the time, so they get a steeper curve to keep their differences visible
      const curve = n.kind === 'n1' || n.kind === 'n2' ? 3 : 1.6
      const g = Math.round(38 + 217 * Math.pow(clamp(level(n), 0, 1), curve))
      ctx.fillStyle = `rgb(${g},${g},${g})`
      ctx.strokeStyle = n === hover ? '#22e07a' : '#d6d6d6'
      ctx.lineWidth = n === hover ? 2.4 : 1.2
      ctx.beginPath(); ctx.arc(n.cx, n.cy, n.r, 0, Math.PI * 2); ctx.fill(); ctx.stroke()
    }
  }
}

function drawText () {
  const shown = `showing ${META.shown} of ${META.layer}`
  ctx.textBaseline = 'middle'
  ctx.textAlign = 'center'
  ctx.font = `700 ${L.size}px ${FONT}`
  ctx.fillStyle = '#ececec'
  ;['Inputs', `Layer 1, ${shown}`, `Layer 2, ${shown}`, 'Decisions'].forEach((t, i) => ctx.fillText(t, L.xs[i], L.headH / 2 + 2))

  ctx.textAlign = 'right'
  ctx.font = `600 ${L.size}px ${FONT}`
  ctx.fillStyle = '#d8d8d8'
  L.columns[0].forEach(n => ctx.fillText(META.nodes[n.i][0], n.cx - n.r - L.gap, n.cy))

  ctx.textAlign = 'left'
  L.columns[3].forEach(n => {
    const d = META.actions[n.i], x = n.cx + n.r + L.gap
    ctx.font = `600 ${L.size}px ${FONT}`
    ctx.fillStyle = '#d8d8d8'
    ctx.fillText(d.name, x, n.cy)
    if (!F) return
    const opt = F.pick[n.i], px = x + L.nameW + L.gap
    ctx.font = `700 ${L.size}px ${FONT}`
    ctx.fillStyle = '#ffffff'
    ctx.fillText(d.options[opt], px, n.cy)
    const w = ctx.measureText(d.options[opt]).width
    ctx.font = `500 ${L.small}px ${FONT}`
    ctx.fillStyle = '#a2a2a2'
    ctx.fillText(`${(F.p[L.bases[n.i] + opt] * 100).toFixed(0)}%`, px + w + L.gap * 0.8, n.cy)
  })
}

function draw () {
  if (!L) return
  ctx.clearRect(0, 0, L.W, L.H)
  drawLines()
  drawCircles()
  drawText()
}

// Reads one input as its real value with units
function shownValue (i) {
  const m = META.inputs[i], raw = F.raw[i]
  if (m.kind === 'flag') return raw >= 0.5 ? 'yes' : 'no'
  if (m.kind === 'cell') return raw > 0.5 ? 'wall or block' : raw < -0.5 ? 'hole or lava' : 'open floor'
  const v = raw * m.scale, sign = m.signed && v > 0 ? '+' : ''
  const unit = m.unit ? (m.unit === '%' ? '%' : ` ${m.unit}`) : ''
  let text = `${sign}${v.toFixed(m.digits)}${unit}`
  if (m.cap != null && Math.abs(raw) >= m.cap - 1e-4) text += v < 0 ? ' or lower' : ' or more'
  return text
}

function groundTip () {
  const k = META.ground_size, mid = Math.floor(k * k / 2)
  let cells = ''
  for (let c = 0; c < k * k; c++) {
    const v = F.raw[META.ground + c]
    cells += `<i class="${v > 0.5 ? 'wall' : v < -0.5 ? 'hole' : ''}${c === mid ? ' me' : ''}"></i>`
  }
  return `<h3>Ground around me</h3><div class="map" style="grid-template-columns:repeat(${k},1fr)">${cells}</div>` +
    '<div class="dim">Top is where I look, green outline is me. Gray is open floor, white is a wall or block, red is a hole or lava.</div>'
}

function tipHtml (n) {
  if (n.kind === 'input') {
    const node = META.nodes[n.i]
    if (!F) return `<h3>${esc(node[0])}</h3><div class="dim">waiting for the first decision</div>`
    if (META.known && node[1][0] === META.ground) return groundTip()
    if (!META.known) return `<h3>${esc(node[0])}</h3><div class="dim">meaning not known for this network</div>`
    const rows = node[1].map(i => `<tr><td>${esc(META.inputs[i].name)}</td><td class="n">${esc(shownValue(i))}</td></tr>`)
    return `<h3>${esc(node[0])}</h3><table>${rows.join('')}</table>`
  }
  if (n.kind === 'decision') {
    const d = META.actions[n.i]
    if (!F) return `<h3>${esc(d.name)}</h3><div class="dim">waiting for the first decision</div>`
    const base = L.bases[n.i]
    const rows = d.order.map(o => {
      const allowed = F.m[base + o] > 0, picked = F.pick[n.i] === o
      return `<tr class="${picked ? 'pk' : allowed ? '' : 'off'}"><td>${esc(d.options[o])}${picked ? ', picked' : ''}</td>` +
        `<td class="n">${allowed ? (F.p[base + o] * 100).toFixed(1) + '%' : 'not allowed'}</td></tr>`
    })
    return `<h3>${esc(d.name)}</h3><table>${rows.join('')}</table>`
  }
  const layer = n.kind === 'n1' ? 1 : 2, real = (layer === 1 ? META.sel1 : META.sel2)[n.i]
  if (!F) return `<h3>Layer ${layer}, neuron ${real}</h3><div class="dim">waiting for the first decision</div>`
  const at = (layer - 1) * META.shown + n.i, a = (layer === 1 ? F.h1[n.i] : F.h2[n.i]) / 127
  let rows = ''
  for (let k = 0; k < 3; k++) {
    const slot = F.ti[at * 3 + k], c = F.tc[at * 3 + k] / 32767 * META.push_scale
    const name = META.known ? META.inputs[slot].name : 'An input'
    const value = META.known ? ` <span class="dim">${esc(shownValue(slot))}</span>` : ''
    rows += `<tr><td>${esc(name)}${value}</td><td class="n">${c >= 0 ? '+' : ''}${c.toFixed(2)}</td></tr>`
  }
  return `<h3>Layer ${layer}, neuron ${real}</h3><div class="dim">activation ${a >= 0 ? '+' : ''}${a.toFixed(2)}, pushed hardest by</div><table>${rows}</table>`
}

function placeTip () {
  if (!hover || !mouse) { tip.style.display = 'none'; return }
  tip.innerHTML = tipHtml(hover)
  tip.style.display = 'block'
  const b = tip.getBoundingClientRect(), gap = 16
  let x = mouse.x + gap, y = mouse.y - b.height / 2
  if (x + b.width > innerWidth - 6) x = mouse.x - b.width - gap
  y = clamp(y, 6, Math.max(6, innerHeight - b.height - 6))
  tip.style.left = Math.max(6, x) + 'px'
  tip.style.top = y + 'px'
}

// A circle, or the words beside an input or decision circle
function hit (x, y) {
  if (!L) return null
  for (const col of L.columns) {
    for (const n of col) {
      if (Math.hypot(n.cx - x, n.cy - y) <= n.r + 1.5) return n
      const rowH = Math.max(n.r * 2, L.size + 4)
      if (Math.abs(n.cy - y) > rowH / 2) continue
      if (n.kind === 'input' && x >= n.cx - n.r - L.gap - L.labelW && x <= n.cx) return n
      if (n.kind === 'decision' && x >= n.cx && x <= n.cx + n.r + L.gap + L.rightW) return n
    }
  }
  return null
}

canvas.onmousemove = e => {
  const b = canvas.getBoundingClientRect()
  mouse = { x: e.clientX, y: e.clientY }
  const h = hit(e.clientX - b.left, e.clientY - b.top)
  if (h !== hover) { hover = h; draw() }
  placeTip()
}
canvas.onmouseleave = () => { hover = null; mouse = null; placeTip(); draw() }
// The bottom strip changes height when round stats arrive, so the diagram follows its own box and not only the window
function relayout () {
  if (!META || (L && L.W === canvas.clientWidth && L.H === canvas.clientHeight)) return
  L = layout(); hover = null; placeTip(); draw()
}
window.onresize = relayout
new ResizeObserver(relayout).observe(document.querySelector('main'))

function setStatus () {
  const fresh = performance.now() - lastFrame < 1500
  statusEl.className = connected && fresh ? 'live' : ''
  statusEl.textContent = !connected ? 'reconnecting' : fresh ? 'LIVE' : 'waiting for a fight'
}

function showValue (v) {
  const [lo, hi] = META.value, f = clamp((v - lo) / (hi - lo), 0, 1)
  document.getElementById('fill').style.left = (f * 100).toFixed(1) + '%'
  document.getElementById('valueText').textContent = `${v >= 0 ? '+' : ''}${v.toFixed(2)}`
}

const fmt = v => v == null ? 'n/a' : Number(v).toFixed(1)
const whole = v => v == null ? 'n/a' : String(Math.round(v))
const pair = (a, b) => `<div><span class="who">FNNs</span><b>${a}</b></div><div><span class="who">Player</span><b>${b}</b></div>`
const tile = (head, body) => `<div class="tile"><div class="h">${head}</div>${body}</div>`

function resultWords (r) {
  if (r === 'win') return ['FNNs won', 'won']
  if (r === 'loss') return ['Player won', 'lost']
  if (r === 'unknown') return ['Result not recorded', '']
  if (r === 'timeout') return ['Time ran out', '']
  return [r === 'draw' ? 'Draw' : String(r), '']
}

function showRounds (d) {
  const rec = d.record, m = rec.match
  const score = m.fights === 0 && m.final ? m.final : m
  document.getElementById('score').textContent = `FNNs ${score.bot}, Player ${score.you}`
  document.getElementById('matchNote').textContent = m.fights === 0 && m.final
    ? (m.final.bot === m.final.you ? 'match tied' : m.final.bot > m.final.you ? 'FNNs took the match' : 'Player took the match')
    : m.fights ? `after round ${m.fights}` : 'no rounds yet'

  const last = d.pending || (d.rounds.length ? d.rounds[d.rounds.length - 1] : rec.last)
  document.getElementById('lastLab').textContent = d.pending ? 'Last round, a crit or arrow on the final blow is added when the next round starts' : 'Last round'
  const tiles = document.getElementById('tiles')
  if (!last) {
    tiles.innerHTML = '<div class="tile"><div class="h">Stats appear after the first finished round</div></div>'
  } else {
    const [words, cls] = resultWords(last.result)
    const seconds = last.steps == null ? 'n/a' : `${(last.steps / 10).toFixed(1)} s`
    let html = tile('Result', `<div><b class="${cls}">${esc(words)}</b></div><div>${seconds}</div>`)
    html += tile('HP left', pair(fmt(last.hp), fmt(last.enemy_hp)))
    if (last.full) {
      html += tile('FNNs damage', `<div><span class="who">dealt</span><b>${fmt(last.dealt)}</b></div><div><span class="who">taken</span><b>${fmt(last.taken)}</b></div>`)
      html += tile('Crits landed', `<div><span class="who">FNNs</span><b>${whole(last.crits)}</b></div>`)
      html += tile('Arrows landed', pair(whole(last.arrow_hits), whole(last.arrow_hit_me)))
      html += tile('Shield blocks', `<div><span class="who">FNNs</span><b>${whole(last.my_blocks)}</b></div>`)
    } else {
      html += tile('Details', '<div class="h">recorded from the next finished round</div>')
    }
    tiles.innerHTML = html
  }

  document.getElementById('record').innerHTML = `<span class="won">${rec.wins} wins</span>, <span class="lost">${rec.losses} losses</span>`
  const left = []
  if (rec.unknown) left.push(`${rec.unknown} unknown not counted`)
  if (rec.other) left.push(`${rec.other} draws or unfinished`)
  document.getElementById('recNote').textContent = left.join(', ')
  document.getElementById('recent').innerHTML = rec.recent.map(r => `<i class="${r === 'win' || r === 'loss' ? r : ''}" title="${esc(resultWords(r)[0])}"></i>`).join('')
  window.FNNS.rounds = d
}

async function pollRounds () {
  try { showRounds(await (await fetch('/rounds', { cache: 'no-store' })).json()) } catch (err) { window.FNNS.errors++ }
}

function connect () {
  const Stream = window['Ev' + 'entSource']
  const source = new Stream('/stream')
  source.onopen = () => { connected = true; setStatus() }
  source.onerror = () => { connected = false; setStatus() }
  source.onmessage = m => {
    try {
      F = decode(JSON.parse(m.data))
      lastFrame = performance.now()
      connected = true
      showValue(F.v)
      draw()
      if (hover) placeTip()
      setStatus()
      window.FNNS.frames++
    } catch (err) { window.FNNS.errors++ }
  }
}

window.FNNS = { frames: 0, errors: 0, rounds: null, get layout () { return L }, get frame () { return F } }
fetch('/meta').then(r => r.json()).then(m => {
  META = m
  document.getElementById('note').textContent = `Lines are real weights times live activity, brighter and thicker is stronger. ${m.note}`
  L = layout()
  draw()
  connect()
  pollRounds()
  setInterval(pollRounds, 1000)
  setInterval(setStatus, 500)
})
</script>
</body>
</html>
